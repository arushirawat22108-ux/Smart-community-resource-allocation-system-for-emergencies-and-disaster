# ───────────────────────── Server ─────────────────────────
server.port=8080
spring.application.name=cras-phase3

# ───────────────────────── MySQL ──────────────────────────
# The database is created automatically if it does not exist.
# YOUR MySQL password: either edit the default after ':' below, or set the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:mysql://localhost:3306/cras_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# The Concurrency Lab opens up to 32 connections at once.
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ───────────────────────── CRAS ───────────────────────────
cras.priority.mode=phase3
cras.ai.enabled=true
cras.ai.url=http://localhost:8001
cras.ai.cache-seconds=60

# Autopilot scheduler daemon (start it from the Manager Desk)
cras.autopilot.interval-ms=5000
cras.autopilot.enabled-at-start=false

# ───────────────────────── Security ───────────────────────
cras.jwt.secret=CRAS_Phase3_Secret_Key_Change_In_Production_Must_Be_Long_Enough_256bits
cras.jwt.expiration-ms=86400000
# Brute-force protection: lock an e-mail for N seconds after M consecutive failures
cras.security.max-login-attempts=5
cras.security.lockout-seconds=60

# ───────────────────────── Demo accounts ──────────────────
# Re-applied on every start, so the database always matches this file.
# For anything other than a local demo set cras.seed.enabled=false.
cras.seed.enabled=true
cras.seed.admin-password=CRAS_Admin#82Xq!
cras.seed.manager-password=CRAS_Manager#73Lp!
cras.seed.user-password=CRAS_User#91Km!
