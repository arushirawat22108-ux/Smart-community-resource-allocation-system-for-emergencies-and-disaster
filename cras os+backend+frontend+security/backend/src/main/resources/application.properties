spring.application.name=CRAS

spring.datasource.url=jdbc:mysql://localhost:3306/cras_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT: replace this in a real deployment with a long random secret.
cras.jwt.secret=CRAS_PHASE3_DEMO_SECRET_CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_2026
cras.jwt.expiration-ms=86400000
